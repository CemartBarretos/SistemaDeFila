<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - CEMART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center p-6">

  <div class="bg-white rounded-3xl max-w-sm w-full p-8 shadow-xl border border-slate-200 space-y-6">
    <div class="text-center">
      <div class="w-12 h-12 bg-indigo-50 text-indigo-700 rounded-xl flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-900">Nova Senha</h2>
      <p class="text-xs text-slate-500 mt-1">Crie sua nova senha de acesso ao painel do CEMART.</p>
    </div>

    <form id="formNovaSenha" onsubmit="atualizarSenha(event)" class="space-y-4">
      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nova Senha</label>
        <input type="password" id="senha1" required minlength="6" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Confirmar Nova Senha</label>
        <input type="password" id="senha2" required minlength="6" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
      </div>

      <p id="erroMensagem" class="text-[11px] text-rose-600 text-center font-medium hidden"></p>

      <button type="submit" id="btnSalvar" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md transition">
        Atualizar Senha
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-100">
      <a href="index.html" class="text-xs text-indigo-600 font-semibold hover:text-indigo-800">Voltar para o Início</a>
    </div>
  </div>

  <script>
    async function atualizarSenha(e) {
      e.preventDefault();
      const p1 = document.getElementById('senha1').value;
      const p2 = document.getElementById('senha2').value;
      const btn = document.getElementById('btnSalvar');
      const erro = document.getElementById('erroMensagem');

      if (p1 !== p2) {
        erro.innerText = 'As senhas não coincidem.';
        erro.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Atualizando...';
      erro.classList.add('hidden');

      try {
        const { data, error } = await db.auth.updateUser({ password: p1 });
        if (error) throw error;
        alert('Sua senha foi atualizada com sucesso! Você pode voltar a fazer login.');
        await db.auth.signOut();
        window.location.href = 'index.html';
      } catch (err) {
        erro.innerText = 'Ocorreu um erro. O link de recuperação pode ter expirado.';
        erro.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Atualizar Senha';
      }
    }
  </script>
</body>
</html>

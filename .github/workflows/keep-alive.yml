name: Supabase Keep-Alive

on:
  schedule:
    # Roda automaticamente a cada 3 dias (às 08:00 UTC)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permite testar o clique manual no painel do GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar requisição HTTP para evitar inatividade
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Faz uma consulta simples na tabela de cursos para gerar atividade na API
          curl -X GET "${SUPABASE_URL}/rest/v1/cursos?select=id_curso&limit=1" \
          -H "apikey: ${SUPABASE_ANON_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"

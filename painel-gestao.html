<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Secretaria - CEMART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    if (sessionStorage.getItem('autenticado_cemart') !== 'true') {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-1.5 rounded-xl shadow-sm flex items-center justify-center">
          <img src="logo-cemart.png" alt="Logo CEMART" class="h-8 sm:h-10 w-auto object-contain">
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight">CEMART - Painel da Secretaria</h1>
          <p class="text-xs text-indigo-200">Gestão de Vagas e Chamadas</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="abrirModalAcessos()" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-users text-xs text-amber-400"></i> Acessos
        </button>
        <button onclick="abrirModalCursos()" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-graduation-cap text-xs text-amber-400"></i> Cursos
        </button>
        <button onclick="abrirModalQRCode()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-indigo-950 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-qrcode text-xs"></i> QR Code
        </button>
        <button onclick="exportarCSV()" class="px-3 py-1.5 bg-indigo-800 hover:bg-indigo-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-file-csv text-xs"></i> Exportar
        </button>
        <button onclick="abrirModalSenha()" class="px-3 py-1.5 bg-indigo-800 hover:bg-indigo-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-key text-[10px]"></i> Senha
        </button>
        <button onclick="fazerLogout()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-right-from-bracket text-[10px]"></i> Sair
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6 flex-1 w-full space-y-6">

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <span class="text-xs text-slate-500 font-medium">Total de Registros</span>
        <p id="totalRegistros" class="text-2xl font-black text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <span class="text-xs text-amber-600 font-medium">Na Fila</span>
        <p id="totalAguardando" class="text-2xl font-black text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <span class="text-xs text-blue-600 font-medium">Convocados</span>
        <p id="totalConvocados" class="text-2xl font-black text-blue-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <span class="text-xs text-emerald-600 font-medium">Matriculados</span>
        <p id="totalMatriculados" class="text-2xl font-black text-emerald-600 mt-1">0</p>
      </div>
    </div>

    <!-- Barra de Filtros -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2.5 flex-1 min-w-[280px]">
        <div class="relative flex-1 min-w-[180px]">
          <input type="text" id="buscaTexto" oninput="filtrarTabela()" placeholder="Buscar aluno, protocolo..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        </div>
        <select id="filtroNucleo" onchange="atualizarFiltroCursos(); filtrarTabela()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 font-medium text-slate-700">
          <option value="">Todos os Núcleos</option>
          <option value="Dança">🩰 Dança</option>
          <option value="Artes">🎭 Artes</option>
          <option value="Música">🎵 Música</option>
        </select>
        <select id="filtroCurso" onchange="filtrarTabela()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600">
          <option value="">Todos os Cursos</option>
        </select>
        <select id="filtroStatus" onchange="filtrarTabela()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600">
          <option value="">Todos os Status</option>
          <option value="Aguardando">Aguardando</option>
          <option value="Convocado">Convocado</option>
          <option value="Matriculado">Matriculado</option>
          <option value="Desistente">Desistente</option>
        </select>
      </div>
      <button onclick="carregarDadosFila()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-rotate"></i> Atualizar
      </button>
    </div>

    <!-- Tabela -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-50 text-slate-700 uppercase font-bold text-[10px] tracking-wider border-b border-slate-200">
            <tr>
              <th class="px-4 py-3 text-center">Pos.</th>
              <th class="px-4 py-3">Candidato / Contatos</th>
              <th class="px-4 py-3">Curso / Info</th>
              <th class="px-4 py-3">Inscrição</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="px-4 py-8 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i>
                <p>A iniciar o painel...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ================= MODAIS ================= -->
  
  <div id="modalAcessos" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[92vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div><h3 class="text-sm font-bold text-slate-800">Gestão de Acessos</h3></div>
        <button onclick="fecharModalAcessos()" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="adicionarAcesso(event)" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2.5">
        <div class="flex gap-2">
          <input type="email" id="novoEmailInput" required placeholder="E-mail (ex: joao@gmail.com)" class="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 focus:outline-none">
          <button type="submit" id="btnAdicionarAcesso" class="px-4 py-2 bg-indigo-600 text-white font-semibold text-xs rounded-xl cursor-pointer">Autorizar</button>
        </div>
      </form>
      <div class="flex-1 overflow-y-auto divide-y divide-slate-100 mt-2" id="listaAcessosModal"></div>
      <div class="pt-2 text-right border-t border-slate-100 mt-2">
        <button onclick="fecharModalAcessos()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs cursor-pointer">Fechar</button>
      </div>
    </div>
  </div>

  <div id="modalCursos" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[92vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div><h3 class="text-sm font-bold text-slate-800">Catálogo de Cursos</h3></div>
        <button onclick="fecharModalCursos()" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="adicionarCurso(event)" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2.5">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2">
          <input type="text" id="novoCursoInput" required placeholder="Oficina..." class="md:col-span-3 px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs uppercase focus:outline-none">
          <select id="novoCursoNucleo" required class="md:col-span-2 px-2 py-2 bg-white border border-slate-300 rounded-xl text-xs font-medium">
            <option value="Dança">Dança</option><option value="Artes">Artes</option><option value="Música">Música</option>
          </select>
          <input type="text" id="novoCursoArea" required placeholder="Área..." class="md:col-span-2 px-2.5 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none">
          <input type="number" id="novoCursoIdadeMin" min="0" placeholder="Id. Min" class="md:col-span-1 px-2 py-2 bg-white border border-slate-300 rounded-xl text-xs text-center focus:outline-none">
          <input type="number" id="novoCursoIdadeMax" min="0" placeholder="Id. Max" class="md:col-span-1 px-2 py-2 bg-white border border-slate-300 rounded-xl text-xs text-center focus:outline-none">
          <input type="number" id="novoCursoLimite" min="0" placeholder="Limite Vagas" class="md:col-span-2 px-2 py-2 bg-amber-50 border border-amber-300 rounded-xl text-xs text-center font-bold text-amber-900 focus:outline-none">
          <button type="submit" id="btnAdicionarCurso" class="md:col-span-1 px-2 py-2 bg-indigo-600 text-white rounded-xl cursor-pointer"><i class="fa-solid fa-plus"></i></button>
        </div>
      </form>
      <div class="flex-1 overflow-y-auto divide-y divide-slate-100 pr-1 space-y-4" id="listaCursosModal"></div>
      <div class="pt-2 text-right border-t border-slate-100">
        <button onclick="fecharModalCursos()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs cursor-pointer">Fechar</button>
      </div>
    </div>
  </div>

  <div id="modalQRCode" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 text-center space-y-4">
      <div class="w-12 h-12 bg-amber-100 text-amber-700 rounded-2xl flex items-center justify-center mx-auto text-xl"><i class="fa-solid fa-qrcode"></i></div>
      <h3 class="text-base font-bold text-slate-800">QR Code</h3>
      <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 flex justify-center items-center"><div id="areaQRCode"></div></div>
      <div class="flex gap-2">
        <button onclick="window.print()" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl text-xs cursor-pointer"><i class="fa-solid fa-print"></i> Imprimir</button>
        <button onclick="fecharModalQRCode()" class="px-4 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-xs cursor-pointer">Fechar</button>
      </div>
    </div>
  </div>

  <div id="modalSenha" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-xs w-full p-6 shadow-xl border border-slate-200 space-y-4">
      <h3 class="text-sm font-bold text-slate-800">Alterar Palavra-passe</h3>
      <form onsubmit="processarTrocaSenha(event)" class="space-y-3">
        <div><input type="password" id="senhaAtualInput" required placeholder="Senha Atual" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs"></div>
        <div><input type="password" id="senhaNovaInput" required minlength="6" placeholder="Nova Senha" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="fecharModalSenha()" class="px-3 py-2 text-slate-500 text-xs cursor-pointer">Cancelar</button>
          <button type="submit" id="btnSalvarSenha" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs cursor-pointer">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script>
    let registrosGlobais = []; 
    let cursosBanco = [];
    
    // VARIÁVEIS DE AUDITORIA E PERMISSÕES
    let emailUsuarioLogado = '';
    const emailsDaDiretoria = [
      'ca.gasparetto@gmail.com', 
      'caggonca@trf3.jus.br', 
      'ca.gasparetto@outlook.com'
    ];

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatarTelefoneExibicao(tel) {
      if (!tel) return '';
      const d = String(tel).replace(/\D/g, '');
      if (d.length === 11) return d.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      if (d.length === 10) return d.replace(/^(\d{2})(\d{4})(\d{4})$/, '($1) $2-$3');
      return tel;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const corpo = document.getElementById('tabelaCorpo');
      try {
        if (typeof db === 'undefined') throw new Error('Falha de conexão com o Supabase.');

        const sessionRes = await db.auth.getSession();
        if (!sessionRes.data || !sessionRes.data.session) {
          sessionStorage.removeItem('autenticado_cemart');
          window.location.href = 'index.html';
          return;
        }

        emailUsuarioLogado = sessionRes.data.session.user.email;

        await carregarCursosFiltro();
        await carregarDadosFila();

      } catch (err) {
        console.error('ERRO:', err);
        corpo.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-rose-600 font-bold">Erro: ${escapeHTML(err.message)}</td></tr>`;
      }
    });

    /* --- GESTÃO DE ACESSOS --- */
    async function abrirModalAcessos() { document.getElementById('modalAcessos').classList.remove('hidden'); document.getElementById('modalAcessos').classList.add('flex'); await listarAcessos(); }
    function fecharModalAcessos() { document.getElementById('modalAcessos').classList.add('hidden'); document.getElementById('modalAcessos').classList.remove('flex'); }
    
    async function listarAcessos() {
      const listaEl = document.getElementById('listaAcessosModal');
      listaEl.innerHTML = '<p class="text-center py-4 text-xs text-slate-400">Carregando...</p>';
      try {
        const { data: usuarios, error } = await db.from('usuarios_permitidos').select('*').order('criado_em', { ascending: true });
        if (error) throw error;
        listaEl.innerHTML = '';
        if (!usuarios || usuarios.length === 0) { listaEl.innerHTML = '<p class="text-center py-4 text-xs text-slate-400">Nenhum e-mail autorizado.</p>'; return; }
        usuarios.forEach(u => {
          const div = document.createElement('div');
          div.className = 'py-3 flex items-center justify-between gap-3 px-2 hover:bg-slate-50 rounded-lg transition';
          div.innerHTML = `<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs"><i class="fa-solid fa-user"></i></div><div><span class="text-xs font-bold text-slate-800">${escapeHTML(u.email)}</span></div></div><button onclick="removerAcesso(${u.id}, '${encodeURIComponent(u.email)}')" class="px-2.5 py-1.5 bg-white border border-slate-200 text-slate-400 hover:text-rose-600 rounded-lg transition cursor-pointer"><i class="fa-solid fa-trash-can text-xs"></i></button>`;
          listaEl.appendChild(div);
        });
      } catch (e) { listaEl.innerHTML = '<p class="text-center py-4 text-xs text-rose-500">Erro ao listar permissões.</p>'; }
    }

    async function adicionarAcesso(e) {
      e.preventDefault(); 
      const email = document.getElementById('novoEmailInput').value.trim().toLowerCase();
      if (!email) return; 
      const btn = document.getElementById('btnAdicionarAcesso'); btn.disabled = true;
      try { 
        const { error } = await db.from('usuarios_permitidos').insert([{ email: email }]); 
        if (error) throw error; 
        document.getElementById('novoEmailInput').value = ''; 
        await listarAcessos(); 
      } catch (err) { alert('Erro ao adicionar e-mail.'); } 
      finally { btn.disabled = false; }
    }

    async function removerAcesso(id, emailCod) {
      if (!confirm(`Revogar o acesso de ${decodeURIComponent(emailCod)}?`)) return;
      try { await db.from('usuarios_permitidos').delete().eq('id', id); await listarAcessos(); } catch (err) { alert('Erro ao remover.'); }
    }

    /* --- CURSOS E TABELA FILA --- */
    async function carregarCursosFiltro() { 
      const { data: cursos, error } = await db.from('cursos').select('*').order('nome_curso'); 
      if (error) throw new Error(error.message);
      cursosBanco = cursos || []; 
      atualizarFiltroCursos(); 
    }

    function atualizarFiltroCursos() {
      const nucleoSel = document.getElementById('filtroNucleo').value; 
      const select = document.getElementById('filtroCurso'); 
      const valorAnterior = select.value;
      select.innerHTML = '<option value="">Todos os Cursos</option>';
      const filtrados = nucleoSel ? cursosBanco.filter(c => c.nucleo === nucleoSel) : cursosBanco;
      filtrados.forEach(c => { 
        if (c.ativo !== false) { 
          const opt = document.createElement('option'); opt.value = c.nome_curso; opt.textContent = c.nome_curso; select.appendChild(opt); 
        } 
      });
      if (valorAnterior && Array.from(select.options).some(o => o.value === valorAnterior)) select.value = valorAnterior;
    }

    async function carregarDadosFila() {
      const { data, error } = await db.from('fila_cemart').select('*').order('criado_em', { ascending: true });
      if (error) throw new Error(error.message);
      registrosGlobais = data || []; 
      atualizarCards(registrosGlobais); 
      filtrarTabela();
    }

    function renderizarTabela(lista) {
      const corpo = document.getElementById('tabelaCorpo'); 
      corpo.innerHTML = '';
      if (!lista || lista.length === 0) { 
        corpo.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-500 font-bold bg-slate-50">Nenhum registo encontrado.</td></tr>'; 
        return; 
      }
      const contadores = {};
      lista.forEach(reg => {
        let posicaoTexto = '-';
        if (reg.status === 'Aguardando') { 
          const chave = `${reg.curso}_${reg.periodo}`; 
          contadores[chave] = (contadores[chave] || 0) + 1; 
          posicaoTexto = `${contadores[chave]}º`; 
        }
        
        const dataFormatada = reg.criado_em ? new Date(reg.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
        const fonePrincipal = reg.fone1 ? String(reg.fone1).replace(/\D/g, '') : '';
        const foneSecundario = reg.fone2 ? String(reg.fone2).replace(/\D/g, '') : '';
        let textoContatos = fonePrincipal ? formatarTelefoneExibicao(fonePrincipal) : '';
        if (foneSecundario) textoContatos += (textoContatos ? ' / ' : '') + formatarTelefoneExibicao(foneSecundario);
        if (!textoContatos) textoContatos = 'Sem telefone';
        
        const cursoInfo = cursosBanco.find(c => c.nome_curso === reg.curso);
        const nucleoTag = cursoInfo && cursoInfo.nucleo ? `<span class="text-[10px] font-semibold text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded mr-1">${escapeHTML(cursoInfo.nucleo)}</span>` : '';
        
        let statusClass = 'bg-amber-100 text-amber-800 border-amber-200';
        if (reg.status === 'Convocado') statusClass = 'bg-blue-100 text-blue-800 border-blue-200';
        if (reg.status === 'Matriculado') statusClass = 'bg-emerald-100 text-emerald-800 border-emerald-200';
        if (reg.status === 'Desistente') statusClass = 'bg-rose-100 text-rose-800 border-rose-200';

        const telParaWhatsApp = fonePrincipal || foneSecundario;
        let btnConvocar = '';
        if (reg.status === 'Aguardando' && telParaWhatsApp) {
          btnConvocar = `<button onclick="convocarWhatsApp(${reg.id}, '${encodeURIComponent(reg.nome_aluno || '')}', '${telParaWhatsApp}', '${encodeURIComponent(reg.curso || '')}', '${encodeURIComponent(reg.periodo || '')}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[11px] font-bold transition shadow-xs flex items-center gap-1.5 cursor-pointer"><i class="fa-brands fa-whatsapp text-xs"></i> Convocar</button>`;
        }

        // AUDITORIA: Verifica se há dados e se o usuário logado é dono
        let infoAuditoria = '';
        if (reg.atualizado_por && emailsDaDiretoria.includes(emailUsuarioLogado)) {
          infoAuditoria = `<p class="text-[9px] text-slate-400 mt-1.5 pt-1 border-t border-slate-200/50" title="Última alteração"><i class="fa-solid fa-user-pen mr-0.5"></i> ${escapeHTML(reg.atualizado_por)}</p>`;
        }

        const tr = document.createElement('tr'); 
        tr.className = 'hover:bg-slate-50 transition';
        tr.innerHTML = `
          <td class="px-4 py-3 font-bold text-center text-indigo-700">${posicaoTexto}</td>
          <td class="px-4 py-3">
            <p class="font-bold text-slate-800">${escapeHTML(reg.nome_aluno)}</p>
            <p class="text-[11px] text-slate-500 mt-0.5"><i class="fa-solid fa-phone text-[10px] text-slate-400 mr-1"></i>${textoContatos}</p>
          </td>
          <td class="px-4 py-3">
            <div class="flex items-center">${nucleoTag}<span class="font-bold text-slate-700">${escapeHTML(reg.curso) || '-'}</span></div>
            <p class="text-[11px] text-slate-400">${escapeHTML(reg.periodo) || '-'}</p>
          </td>
          <td class="px-4 py-3">
            <p class="text-[11px] text-slate-500 mb-1">${dataFormatada}</p>
            <span class="text-[10px] font-mono font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded inline-block border border-indigo-100" title="Protocolo de Inscrição">
              <i class="fa-solid fa-hashtag text-[8px] mr-0.5"></i>${escapeHTML(reg.protocolo)}
            </span>
          </td>
          <td class="px-4 py-3">
            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ${statusClass}">${escapeHTML(reg.status)}</span>
            ${infoAuditoria}
          </td>
          <td class="px-4 py-3 text-right">
            <div class="inline-flex items-center gap-1.5">
              ${btnConvocar}
              <select onchange="atualizarStatus(${reg.id}, this.value)" class="text-[11px] px-2 py-1 bg-slate-100 border border-slate-200 rounded-lg cursor-pointer">
                <option value="Aguardando" ${reg.status === 'Aguardando' ? 'selected' : ''}>Aguardando</option>
                <option value="Convocado" ${reg.status === 'Convocado' ? 'selected' : ''}>Convocado</option>
                <option value="Matriculado" ${reg.status === 'Matriculado' ? 'selected' : ''}>Matriculado</option>
                <option value="Desistente" ${reg.status === 'Desistente' ? 'selected' : ''}>Desistente</option>
              </select>
              <button onclick="excluirCandidato(${reg.id}, '${encodeURIComponent(reg.nome_aluno || '')}')" class="px-2 py-1 bg-white border border-slate-200 text-slate-400 hover:text-rose-600 rounded-lg transition cursor-pointer"><i class="fa-solid fa-trash-can text-[11px]"></i></button>
            </div>
          </td>
        `;
        corpo.appendChild(tr);
      });
    }

    async function atualizarStatus(id, novoStatus) { 
      try { 
        const { error } = await db.from('fila_cemart').update({ status: novoStatus }).eq('id', id); 
        if (error) throw error;
        await carregarDadosFila();
      } catch (err) { alert('Erro ao atualizar status.'); } 
    }

    async function convocarWhatsApp(id, nomeCod, tel, cursoCod, perCod) { 
      const nome = decodeURIComponent(nomeCod); 
      if (!confirm(`Confirmar convocação de ${nome}?`)) return; 
      try { 
        await atualizarStatus(id, 'Convocado'); 
        const msg = `*CEMART - CONVOCAÇÃO DE VAGA*\n\nOlá, *${nome}*!\nSurgiu vaga em *${decodeURIComponent(cursoCod)}*!\nCompareça à secretaria em até *2 dias úteis*.`; 
        window.open(`https://api.whatsapp.com/send?phone=55${tel}&text=${encodeURIComponent(msg)}`, '_blank'); 
      } catch (err) { alert('Erro na convocação.'); } 
    }

    async function excluirCandidato(id, nomeCod) { 
      if (!confirm(`EXCLUIR ${decodeURIComponent(nomeCod)}?`)) return; 
      try { 
        const { error } = await db.from('fila_cemart').delete().eq('id', id); 
        if (error) throw error;
        registrosGlobais = registrosGlobais.filter(r => r.id !== id); 
        atualizarCards(registrosGlobais); 
        filtrarTabela(); 
      } catch (err) { alert('Erro ao excluir registro.'); } 
    }

    function atualizarCards(lista) { 
      document.getElementById('totalRegistros').innerText = lista.length; 
      document.getElementById('totalAguardando').innerText = lista.filter(r => r.status === 'Aguardando').length; 
      document.getElementById('totalConvocados').innerText = lista.filter(r => r.status === 'Convocado').length; 
      document.getElementById('totalMatriculados').innerText = lista.filter(r => r.status === 'Matriculado').length; 
    }

    function filtrarTabela() {
      const texto = document.getElementById('buscaTexto').value.toLowerCase(); 
      const nucleo = document.getElementById('filtroNucleo').value; 
      const curso = document.getElementById('filtroCurso').value; 
      const status = document.getElementById('filtroStatus').value;
      const filtrados = registrosGlobais.filter(r => {
        const nome = (r.nome_aluno || '').toLowerCase(); const prot = (r.protocolo || '').toLowerCase(); const bateTexto = nome.includes(texto) || prot.includes(texto);
        let bateNucleo = true; if (nucleo) { const cInfo = cursosBanco.find(c => c.nome_curso === r.curso); bateNucleo = cInfo && cInfo.nucleo === nucleo; }
        const bateCurso = curso === '' || r.curso === curso; const bateStatus = status === '' || r.status === status; return bateTexto && bateNucleo && bateCurso && bateStatus;
      });
      renderizarTabela(filtrados);
    }

    /* --- CURSOS MODAL --- */
    async function abrirModalCursos() { document.getElementById('modalCursos').classList.remove('hidden'); document.getElementById('modalCursos').classList.add('flex'); await listarCursosModal(); }
    function fecharModalCursos() { document.getElementById('modalCursos').classList.add('hidden'); document.getElementById('modalCursos').classList.remove('flex'); carregarCursosFiltro(); }
    
    async function listarCursosModal() {
      const listaEl = document.getElementById('listaCursosModal'); 
      const scrollPos = listaEl.scrollTop;
      listaEl.innerHTML = '<p class="text-center py-4 text-xs text-slate-400">Carregando...</p>';
      try {
        const { data: cursos, error } = await db.from('cursos').select('*').order('nome_curso');
        if (error) throw error;
        const grupos = {};
        (cursos || []).forEach(c => { const n = c.nucleo || 'Outros'; if (!grupos[n]) grupos[n] = []; grupos[n].push(c); });
        
        listaEl.innerHTML = '';
        for (const [nucleo, lista] of Object.entries(grupos)) {
          const container = document.createElement('div'); container.className = 'pt-2'; 
          container.innerHTML = `<div class="bg-indigo-50/80 px-3 py-1.5 rounded-xl font-bold text-xs text-indigo-900 mb-2">Núcleo de ${escapeHTML(nucleo)}</div>`;
          const divFilhos = document.createElement('div'); divFilhos.className = 'divide-y divide-slate-100 pl-1';
          
          lista.forEach(c => {
            const row = document.createElement('div'); row.className = 'py-3 flex flex-col md:flex-row md:items-center justify-between gap-3';
            row.innerHTML = `
              <div class="flex items-center gap-2 min-w-[180px]">
                <span class="w-2.5 h-2.5 rounded-full ${c.ativo ? 'bg-emerald-500' : 'bg-slate-300'}"></span>
                <div>
                  <span class="text-xs font-semibold ${c.ativo ? 'text-slate-800' : 'text-slate-400 line-through'}">${escapeHTML(c.nome_curso)}</span>
                  <p class="text-[10px] text-slate-400">${escapeHTML(c.area) || 'Geral'}</p>
                </div>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <div class="flex items-center gap-1.5 text-[11px] bg-slate-50 px-2 py-1 rounded-xl border border-slate-200">
                  <span class="text-slate-500">Idade:</span>
                  <input type="number" min="0" value="${c.idade_minima || 0}" onchange="atualizarCampoCurso(${c.id_curso}, 'idade_minima', this.value)" class="w-9 px-1 py-0.5 bg-white border border-slate-300 rounded text-center text-xs font-bold text-slate-700">
                  <span class="text-slate-400">a</span>
                  <input type="number" min="0" value="${c.idade_maxima || ''}" onchange="atualizarCampoCurso(${c.id_curso}, 'idade_maxima', this.value)" class="w-9 px-1 py-0.5 bg-white border border-slate-300 rounded text-center text-xs font-bold text-slate-700">
                </div>
                <div class="flex items-center gap-1.5 text-[11px] bg-amber-50 px-2 py-1 rounded-xl border border-amber-200">
                  <span class="text-amber-700">Limite:</span>
                  <input type="number" min="0" value="${c.limite_fila || 0}" onchange="atualizarCampoCurso(${c.id_curso}, 'limite_fila', this.value)" class="w-12 px-1 py-0.5 bg-white border border-amber-300 rounded text-center text-xs font-bold text-amber-900">
                </div>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <button onclick="alternarTurnoCurso(${c.id_curso}, 'manha', ${c.manha !== false})" class="px-2 py-0.5 rounded text-[10px] font-bold border ${c.manha !== false && c.ativo ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-400'}">Manhã</button>
                <button onclick="alternarTurnoCurso(${c.id_curso}, 'tarde', ${c.tarde !== false})" class="px-2 py-0.5 rounded text-[10px] font-bold border ${c.tarde !== false && c.ativo ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-400'}">Tarde</button>
                <button onclick="alternarTurnoCurso(${c.id_curso}, 'noite', ${c.noite !== false})" class="px-2 py-0.5 rounded text-[10px] font-bold border ${c.noite !== false && c.ativo ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-400'}">Noite</button>
                <button onclick="alternarStatusCurso(${c.id_curso}, ${c.ativo})" class="ml-1 px-2 py-0.5 rounded text-[10px] font-semibold border ${c.ativo ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}">${c.ativo ? 'Inativar' : 'Ativar'}</button>
              </div>
            `;
            divFilhos.appendChild(row);
          });
          container.appendChild(divFilhos); listaEl.appendChild(container);
        }
        setTimeout(() => { listaEl.scrollTop = scrollPos; }, 10);
      } catch (e) { listaEl.innerHTML = '<p class="text-center text-rose-500">Erro ao carregar cursos.</p>'; }
    }

    async function atualizarCampoCurso(idCurso, campo, valor) { try { const updateData = {}; updateData[campo] = valor === '' ? null : parseInt(valor, 10); await db.from('cursos').update(updateData).eq('id_curso', idCurso); } catch (e) { alert('Erro ao atualizar campo.'); } }
    async function alternarTurnoCurso(idCurso, turno, valorAtual) { try { const updateData = {}; updateData[turno] = !valorAtual; await db.from('cursos').update(updateData).eq('id_curso', idCurso); await listarCursosModal(); } catch (e) {} }
    async function alternarStatusCurso(idCurso, statusAtual) { try { await db.from('cursos').update({ ativo: !statusAtual }).eq('id_curso', idCurso); await listarCursosModal(); } catch (e) {} }
    
    async function adicionarCurso(e) {
      e.preventDefault(); 
      const nome = document.getElementById('novoCursoInput').value.trim(); 
      if (!nome) return; 
      document.getElementById('btnAdicionarCurso').disabled = true;
      try { 
        const { error } = await db.from('cursos').insert([{ 
          nome_curso: nome, nucleo: document.getElementById('novoCursoNucleo').value, area: document.getElementById('novoCursoArea').value.trim() || 'Geral', 
          idade_minima: document.getElementById('novoCursoIdadeMin').value ? parseInt(document.getElementById('novoCursoIdadeMin').value) : 0, 
          idade_maxima: document.getElementById('novoCursoIdadeMax').value ? parseInt(document.getElementById('novoCursoIdadeMax').value) : null, 
          limite_fila: document.getElementById('novoCursoLimite').value ? parseInt(document.getElementById('novoCursoLimite').value) : 0, 
          ativo: true, manha: true, tarde: true, noite: true 
        }]); 
        if (error) throw error;
        e.target.reset(); await listarCursosModal(); 
      } catch (err) { alert('Erro ao cadastrar curso.'); } 
      finally { document.getElementById('btnAdicionarCurso').disabled = false; }
    }

    /* --- UTILIDADES, QR CODE, EXPORTAR --- */
    let qrcodeInstancia = null;
    function abrirModalQRCode() { document.getElementById('modalQRCode').classList.remove('hidden'); document.getElementById('modalQRCode').classList.add('flex'); if (!qrcodeInstancia) { qrcodeInstancia = new QRCode(document.getElementById('areaQRCode'), { text: window.location.origin + window.location.pathname.replace('painel-gestao.html', 'inscricao.html'), width: 180, height: 180, colorDark: "#1e1b4b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H }); } }
    function fecharModalQRCode() { document.getElementById('modalQRCode').classList.add('hidden'); document.getElementById('modalQRCode').classList.remove('flex'); }
    
    function exportarCSV() { 
      if (registrosGlobais.length === 0) return alert('Sem registros.'); 
      let csv = '\uFEFFProtocolo;Aluno;Telefone 1;Telefone 2;Curso;Período;Status;Data Inscrição\n'; 
      registrosGlobais.forEach(r => { csv += `"${escapeHTML(r.protocolo)}";"${escapeHTML(r.nome_aluno)}";"${formatarTelefoneExibicao(r.fone1)}";"${formatarTelefoneExibicao(r.fone2)}";"${escapeHTML(r.curso)}";"${escapeHTML(r.periodo)}";"${escapeHTML(r.status)}";"${r.criado_em ? new Date(r.criado_em).toLocaleDateString('pt-BR') : ''}"\n`; }); 
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `fila_cemart.csv`; link.click(); 
    }
    
    function abrirModalSenha() { document.getElementById('modalSenha').classList.remove('hidden'); document.getElementById('modalSenha').classList.add('flex'); }
    function fecharModalSenha() { document.getElementById('modalSenha').classList.add('hidden'); document.getElementById('modalSenha').classList.remove('flex'); }
    
    async function processarTrocaSenha(e) { 
      e.preventDefault(); const btn = document.getElementById('btnSalvarSenha'); btn.disabled = true; btn.innerText = 'A salvar...';
      const senhaAtual = document.getElementById('senhaAtualInput').value; const novaSenha = document.getElementById('senhaNovaInput').value;
      try {
        const { data: { user }, error: userError } = await db.auth.getUser();
        if (userError || !user) throw new Error('Utilizador não identificado.');
        
        const { error: signInError } = await db.auth.signInWithPassword({ email: user.email, password: senhaAtual });
        if (signInError) throw new Error('A palavra-passe atual está incorreta.');
        
        const { error } = await db.auth.updateUser({ password: novaSenha });
        if (error) throw error;
        
        alert('Palavra-passe atualizada com sucesso!'); fecharModalSenha(); document.getElementById('senhaAtualInput').value = ''; document.getElementById('senhaNovaInput').value = '';
      } catch (err) { alert(err.message || 'Erro ao atualizar a palavra-passe.'); } finally { btn.disabled = false; btn.innerText = 'Salvar'; }
    }

    async function fazerLogout() { 
      sessionStorage.removeItem('autenticado_cemart');
      try { await db.auth.signOut(); } catch (e) { console.error('Erro ao sair:', e); }
      window.location.href = 'index.html'; 
    }
  </script>
